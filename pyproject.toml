[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wc"
version = "0.1.0"
description = "Winner's curse correction (m-out-of-N bootstrap) and RULER rank-uncertainty reports for LLM leaderboards"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Sikun Xu" }]
keywords = ["llm", "leaderboard", "benchmark", "winner's curse", "bootstrap", "rank uncertainty"]
dependencies = [
    "datasets>=3.2.0",
    "pyyaml>=6.0.3",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "scipy>=1.16.2",
    "statsmodels>=0.14.6",
]

[project.urls]
Homepage = "https://sikunxu.com/llm-wc/"
Repository = "https://github.com/iamsikun/llm-wc"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.0",
    "jupyterlab>=4.4.10",
    "notebook>=7.4.7",
    "pytest>=8.4.2",
]
parsers = [
    "docent-python>=0.1.56a0",
]
tracker = [
    "jinja2>=3.1",
]
