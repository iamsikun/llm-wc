name: Deploy site

# Publishes the tracker website to GitHub Pages. Off until the repository variable
# PUBLISH_SITE is set to "true" (Settings > Secrets and variables > Actions > Variables),
# with Pages set to deploy from GitHub Actions (Settings > Pages).

on:
  push:
    branches: [main]
    paths:
      - "tracker/**"
      - "src/llm_wc/tracker/**"
      - "results/ruler_audit/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PUBLISH_SITE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --group tracker
      - name: Build
        run: uv run python -m llm_wc.tracker build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
