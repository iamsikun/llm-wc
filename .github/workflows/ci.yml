name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # macOS on Apple Silicon, where results/ was computed: NumPy's default sort orders tied
    # bootstrap scores differently on x86 Linux, which changes the position-level adjustments.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --group dev --group tracker
      - name: Tests (library and tracker, including the reference-fidelity checks)
        run: uv run pytest -q
      - name: Build the site (runs the site's own checks)
        run: uv run python -m llm_wc.tracker build
